project:
  name: "shellforge-135m"
  seed: 42
  output_dir: "./outputs"
  data_dir: "./data"
  schema_db: "./data/cli_schema.sqlite"

# Choose architecture mode:
#   "recshell_120m" -> From-scratch Recursive-Depth (8x3=24 effective layers) + optional BitNet 1.58-bit + Soft-MTP
model:
  mode: "smollm2_135m"
  pretrained_id: "HuggingFaceTB/SmolLM2-135M"
  max_seq_len: 512


  soft_mtp:
    enabled: false
    horizon: 3
    mtp_loss_weight: 0.30
    temperature: 1.0


  recshell:
    vocab_size: 49152
    d_model: 768
    n_heads: 12
    n_kv_heads: 4
    n_physical_layers: 8
    n_recursions: 3
    ffn_dim: 2048
    use_bitnet_158: true
    tie_word_embeddings: true

schema_rag:
  enabled: false
  top_k_tools: 3
  max_schema_chars: 420

# Data Preparation
data:
  hf_dataset: "westenfelder/NL2SH-ALFA"
  extra_jsonl: null
  max_train_samples: 40000
  val_split_ratio: 0.03
  require_bash_n_pass: true
  require_shellcheck_clean: false
  verified_candidates: null
  composed_fixtures: true
  paired_training: false
  include_compact_plan: false

sft:
  contrast_weight: 0.0
  epochs: 4
  batch_size: 4
  grad_accum_steps: 16
  learning_rate: 3.0e-4
  min_lr_ratio: 0.05
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  log_every: 20
  eval_every: 250
  save_dir: "./outputs/sft_ckpt"

rgrpo:
  steps: 600
  prompts_per_step: 4
  group_size: 8
  max_new_tokens: 140
  temperature: 0.85
  top_p: 0.95
  learning_rate: 1.5e-5
  kl_beta: 0.04
  clip_eps: 0.2
  bf16: true
  save_dir: "./outputs/rgrpo_ckpt"

# Inference & Test-Time Verifier Reranking
inference:
  num_candidates: 1
  temperature: 0.4
  top_p: 0.92
  max_new_tokens: 140
